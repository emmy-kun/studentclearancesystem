<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#146C3C" />
    <link rel="icon" type="image/svg+xml" href="/logo-mark.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Student Clearance System</title>
    <!-- Start-up screen shown while the app loads (replaced as soon as React renders). -->
    <style>
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: linear-gradient(160deg, #0d4c2a 0%, #146c3c 60%, #17783f 100%); color: #fff; font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .boot-crest { width: 108px; height: 108px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); }
      .boot-crest img { width: 92px; height: 92px; }
      .boot-name { font-weight: 700; font-size: 17px; letter-spacing: .01em; }
      .boot-sub { font-size: 13px; opacity: .8; margin-top: -12px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <div class="boot-crest"><img src="/loader.svg" alt="" /></div>
        <div class="boot-name">Automated Student Clearance System</div>
        <div class="boot-sub">Clearance and certificate issuance</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
